[project]
name = "everunfold-backend"
version = "0.2.0"
description = "Everunfold blog and lightweight CMS backend — initialization stage"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "celery[redis]==5.6.3",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "fonttools[woff]==4.68.0",
    "httpx2==2.16.0",
    "pillow==13.0.0",
    "prometheus-client==0.26.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "pycrdt==0.14.10",
    "PyYAML==6.0.3",
    "redis==6.4.0",
    "sqlalchemy[asyncio]==2.1.6",
    "tinycss2==1.5.1",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/baseline"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/wordpress_import/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "tools"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "types-PyYAML==6.0.12.20261113",
]
