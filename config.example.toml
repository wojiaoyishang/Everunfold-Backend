# 本地配置结构示例；复制为 config.toml 后填写自己的连接信息。
# 显式加载器支持这些字段并拒绝未知字段；不会自动读取本文件或 .env。
# API、Celery Worker 和 Scheduler 独立运行，部署方式见 docs/source/welcome/。
# 最初的完整规划示例保存在 docs/baseline/02_Engineering_Plan_v0.14.md。

# everunfold-backend/config.example.toml
# 配置结构示例：服务域名按部署替换，数据库与 Redis 地址为本地开发示例
# 不设固定生产基地址；实际凭据通过部署配置或环境变量注入

# 后端对外发布根 URL，用于拼接媒体等资源链接和第三方应用签名查询地址。
# 反代部署填写外部 HTTPS 入口，例如 https://api.example.com；不带 /api 或 /v1。
# API 进程监听由启动参数或 Docker API_HOST/API_PORT 控制，与此 URL 独立。
# 以下仅为本机调试值；生产部署应显式替换为真实发布 URL。
BACKEND_BASE_URL = "http://127.0.0.1:8001"
# 复制 frontend-nodes.example.toml 为 frontend-nodes.toml 后取消注释。
# 相对路径以本配置文件所在目录为准。
# frontend_nodes_file = "./frontend-nodes.toml"

[nodes_monitor]
enabled = false
# 控制台优先使用 BACKEND_BASE_URL；setup 可配置启用开关、密码和会话密钥。
# 公网经 HTTPS。只有省略 BACKEND_BASE_URL 的旧配置才使用 origin。
# origin = "https://ops.example.com"
# 可选：只在可信反代终止 TLS 时填写它直接连接后端的实际 IP。
# trusted_tls_proxy_ips = ["172.28.0.10"]
# 在终端运行 python -m tools.nodes_monitor_password 生成密码哈希。
# password_hash = "在本地填写工具输出的哈希"
session_secret_env = "EVERUNFOLD_NODES_SESSION_SECRET"
session_seconds = 1800

[project]
key = "lovepikachu"            # 唯一项目标识，前缀根为 lovepikachu:

[reader_preview]
# 显式启用后提供 /v1/reader-preview/* 假身份和假浏览量；不创建会话、不记账。
# 仅用于当前前台联调，默认关闭；生产真实身份/统计不能使用这些值。
enabled = false

[auth]
# Session 存 PostgreSQL，Cookie 不保存身份/密码；初始化管理员另运行 init.database.py。
cookie_name = "everunfold_session"
cookie_samesite = "lax"
# 默认非回环浏览器认证使用 HTTPS；cookie_secure 按 BACKEND_BASE_URL 推导。
# 用户明确要求内网 HTTP 调试时可设 allow_private_http = true；仅允许字面
# RFC1918 IPv4 / IPv6 ULA 地址，不放宽内部凭据传输、精确 Origin 或 CSRF。
# allow_private_http = false
# cookie_domain 默认不设置（仅 API 主机），需要同站部署时再明确填写。
session_seconds = 43200
pre_session_seconds = 900
login_window_seconds = 900
login_attempts_per_account = 10
login_attempts_per_ip = 50
bootstrap_attempts_per_ip = 60
# 应用签名主密钥通过部署环境注入（43~128位Base64URL字符），只引用变量名。
application_master_key_env = "EVERUNFOLD_API_APPLICATION_MASTER_KEY"
# Supply the same stable, random secret (at least 32 bytes of entropy) to every API replica.
totp_master_key_env = "EVERUNFOLD_TOTP_MASTER_KEY"
# 回调目标须同时由管理员登记及部署放行；按实际子项目来源填写，不跟随重定向。
callback_allowed_origins = []
# 读取校验的最长缓存秒数；写入不缓存；子项目不得滑动延长期限。
key_cache_seconds = 30

[database]
url = "postgresql+asyncpg://everunfold:change-me@127.0.0.1:5432/everunfold_dev"
# 可由环境变量 DATABASE_URL 覆盖（上面仅为本地开发示例）

[redis]
url = "redis://127.0.0.1:6379/0"   # 项目临时 Key 与 Pub/Sub
namespace_scope = "dev"       # 开发与测试必须使用不同 scope；空值不加环境层

[query_cache]
enabled = true
# 容器开发默认启动此独立实例。其他部署可由环境变量 QUERY_CACHE_REDIS_URL 覆盖。
# 未配置 URL 时走 PostgreSQL。不要把查询缓存指向运行状态或 Broker 使用的 Redis。
# url = "redis://127.0.0.1:6381/0"
ttl_seconds = 45
timeout_ms = 35
max_value_bytes = 262144

[celery]
broker_url = "redis://127.0.0.1:6379/1"
result_backend_url = "redis://127.0.0.1:6379/2"  # 按需使用 Redis 结果后端

# Next.js -> FastAPI：由 FastAPI 校验自己的入站内部请求
[internal_auth]
# 以下仅为本机联调；部署时填写校验入口实际观察到的来源 IP/CIDR
allowed_peer_ips = ["127.0.0.1", "::1"]

# 以下为本轮补充的建议初值，待实现配置加载与压测
[runtime]
health_check_timeout_seconds = 2
http_shutdown_grace_seconds = 30
worker_shutdown_warn_after_seconds = 120  # 仅报警阈值，不代表可无损强杀

[http]
default_page_size = 20
max_page_size = 100
idempotency_retention_seconds = 86400

[limits]
json_body_max_bytes = 8388608
upload_max_bytes = 33554432
ws_update_max_bytes = 1048576
ws_pending_max_bytes_per_connection = 4194304
ws_auth_timeout_seconds = 5

[outbox]
poll_interval_seconds = 1
batch_size = 50
connect_timeout_seconds = 2
request_timeout_seconds = 15
max_attempts = 8
retry_max_delay_seconds = 900
lease_seconds = 60  # 投递租约，须大于单次受控投递时限

# 浏览器认证/后台请求带凭据；公开读取/匿名点赞仍不带凭据。只允许精确来源。
[cors]
allowed_origins = ["http://127.0.0.1:3000", "http://localhost:3000"]
# 启用后，导入 PostgreSQL 的已绑定且启用节点公开地址也可作为浏览器来源。
# use_frontend_registry = true

# 本地图标上传；路径相对于此配置文件。CDN 迁移保持 object_key 不变。
[media]
uploads_path = "./uploads"
# base_url = "https://api.example.com/media" # 缺省 BACKEND_BASE_URL + /media
