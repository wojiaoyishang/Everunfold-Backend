[unix_http_server]
file=%(ENV_EVERUNFOLD_RUNTIME_DIR)s/supervisor.sock
chmod=0600

[supervisord]
logfile=%(ENV_EVERUNFOLD_RUNTIME_DIR)s/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=%(ENV_EVERUNFOLD_RUNTIME_DIR)s/supervisord.pid
childlogdir=%(ENV_EVERUNFOLD_RUNTIME_DIR)s
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_EVERUNFOLD_RUNTIME_DIR)s/supervisor.sock

[program:query-cache]
command=/bin/bash "%(ENV_EVERUNFOLD_BACKEND_ROOT)s/deploy/container-service.sh" query-cache
priority=5
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_EVERUNFOLD_RUNTIME_DIR)s/query-cache.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:api]
command=/bin/bash "%(ENV_EVERUNFOLD_BACKEND_ROOT)s/deploy/container-service.sh" api
priority=10
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=35
redirect_stderr=true
stdout_logfile=%(ENV_EVERUNFOLD_RUNTIME_DIR)s/api.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:worker]
command=/bin/bash "%(ENV_EVERUNFOLD_BACKEND_ROOT)s/deploy/container-service.sh" worker
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=130
redirect_stderr=true
stdout_logfile=%(ENV_EVERUNFOLD_RUNTIME_DIR)s/worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:scheduler]
command=/bin/bash "%(ENV_EVERUNFOLD_BACKEND_ROOT)s/deploy/container-service.sh" scheduler
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=8
stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_EVERUNFOLD_RUNTIME_DIR)s/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:frontend]
command=/bin/bash "%(ENV_EVERUNFOLD_BACKEND_ROOT)s/deploy/container-service.sh" frontend
priority=20
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=35
redirect_stderr=true
stdout_logfile=%(ENV_EVERUNFOLD_RUNTIME_DIR)s/frontend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:proxy]
command=/bin/bash "%(ENV_EVERUNFOLD_BACKEND_ROOT)s/deploy/container-service.sh" proxy
priority=40
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_EVERUNFOLD_RUNTIME_DIR)s/proxy.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
