<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>前端节点 · Everunfold</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: light-dark(#f4f6f9, #15181e);
      --panel: light-dark(#fff, #20242d);
      --text: light-dark(#202a39, #e7ebf2);
      --muted: light-dark(#516077, #aab5c7);
      --line: light-dark(#dbe1e9, #384151);
      --accent: light-dark(#1d4b88, #a9c8ff);
      --positive: light-dark(#12614e, #8cdbbd);
      --warning: light-dark(#785200, #f8ce79);
      --negative: light-dark(#9c292b, #ffaeae);
      font: 16px/1.55 system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden], body[data-mode="login"] .dashboard, body[data-mode="dashboard"] .login { display: none; }
    body { margin: 0; background: var(--page); color: var(--text); }
    main { width: min(100% - 2rem, 68rem); margin: clamp(1.5rem, 5vw, 4rem) auto; }
    body[data-mode="login"] { min-height: 100dvh; display: grid; place-items: center; padding: 1rem; }
    body[data-mode="login"] main { width: min(100%, 25rem); margin: 0; }
    .top, .node-heading, .actions { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; }
    .top, .node-heading { justify-content: space-between; }
    body[data-mode="login"] .top { justify-content: center; text-align: center; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.5rem, 4vw, 2rem); }
    h2 { font-size: 1.12rem; overflow-wrap: anywhere; }
    .muted, dt { color: var(--muted); }
    button, input, select { font: inherit; border: 1px solid var(--line); border-radius: .45rem; }
    button { color: var(--accent); background: var(--panel); cursor: pointer; padding: .46rem .75rem; }
    button:hover { border-color: var(--accent); }
    button:disabled { cursor: wait; opacity: .65; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .primary { background: var(--accent); color: var(--panel); }
    .panel, .health > div { border: 1px solid var(--line); background: var(--panel); border-radius: .75rem; }
    .login { margin-top: 1.2rem; padding: 1.2rem; }
    .login form { display: grid; gap: .6rem; }
    input { min-width: 0; padding: .6rem .7rem; color: var(--text); background: var(--page); }
    #message:not(:empty), #notice:not(:empty) { margin: .8rem 0; }
    #message, .bad { color: var(--negative); }
    #notice, .warn { color: var(--warning); }
    .good { color: var(--positive); }
    .health { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.2rem, 1fr)); gap: .55rem; margin: 1rem 0; }
    .health > div { padding: .65rem .8rem; }
    dt, dd { margin: 0; }
    dd { font-weight: 600; }
    #sample { font-size: .87rem; margin: .6rem 0; }
    #nodes { display: grid; gap: .85rem; }
    .node { padding: 1rem; min-width: 0; }
    .node-url { overflow-wrap: anywhere; font-size: .88rem; }
    .connection { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: .75rem; margin: .8rem 0; font-size: .91rem; }
    .resources { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: .65rem; }
    .resource { border: 1px solid var(--line); border-radius: .55rem; padding: .65rem .75rem; font-size: .88rem; }
    .resource h3 { margin: 0 0 .4rem; font-size: .96rem; }
    .resource dl { display: grid; grid-template-columns: 1fr auto; gap: .2rem .65rem; margin: 0; }
    .resource dd { text-align: right; font-variant-numeric: tabular-nums; }
    .detail { margin-top: .4rem; color: var(--muted); overflow-wrap: anywhere; }
    .query-panel { margin: .85rem 0; padding: 1rem; }
    .query-panel select { padding: .4rem .6rem; background: var(--panel); color: var(--text); }
    .query-caption { margin: .45rem 0; font-size: .88rem; }
    .query-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: .75rem 1rem; }
    .query-charts figure { min-width: 0; margin: .35rem 0; }
    .query-charts figcaption { font-size: .92rem; font-weight: 600; }
    .query-chart { display: block; width: 100%; height: auto; max-height: 12rem; color: var(--muted); }
    .query-chart text { fill: currentColor; font-size: 12px; }
    .query-chart .grid { stroke: var(--line); }
    .query-rate-empty { display: grid; min-height: 6.5rem; align-items: center; }
    .query-line { fill: none; stroke: currentColor; stroke-width: 2; vector-effect: non-scaling-stroke; }
    .query-line.hits { color: var(--positive); }
    .query-line.misses { color: var(--accent); stroke-dasharray: 7 3; }
    .query-line.bypasses { color: var(--warning); stroke-dasharray: 2 3; }
    .query-line.errors { color: var(--negative); stroke-dasharray: 1 2; }
    .query-legend { display: flex; flex-wrap: wrap; gap: .35rem 1rem; margin: .45rem 0; font-size: .88rem; }
    .query-legend span { display: inline-flex; align-items: center; gap: .3rem; }
    .query-legend svg { width: 1.4rem; height: .7rem; }
    .query-overflow { overflow-x: auto; }
    .query-table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: .88rem; }
    .query-table th, .query-table td { padding: .45rem .6rem; border-bottom: 1px solid var(--line); text-align: right; }
    .query-table th:first-child { text-align: left; }
    .query-table thead th { color: var(--muted); font-weight: 500; }
    dialog { width: min(100% - 2rem, 28rem); padding: 1.2rem; color: var(--text); }
    dialog::backdrop { background: #10182680; }
    dialog form, dialog .fields { display: grid; gap: .8rem; }
    dialog .fields { border: 0; padding: 0; margin: 0; min-width: 0; }
    dialog .fields[hidden] { display: none; }
    dialog label:not(.check) { display: grid; gap: .3rem; }
    dialog .actions { justify-content: flex-end; }
  </style>
</head>
<body data-mode="{{mode}}">
  <main>
    <header class="top">
      <h1>前端节点</h1>
      <div class="dashboard actions">
        <button id="refresh" type="button">刷新状态</button>
        <button id="add" class="primary" type="button" hidden>新增节点</button>
        <form id="logout-form" action="/_nodes/logout" method="post"><button type="submit">退出</button></form>
      </div>
    </header>
    <section class="login panel" aria-label="节点监控登录">
      <form id="login-form" action="/_nodes/login" method="post">
        <label for="password">节点监控密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
        <p id="message" role="alert"></p>
        <button class="primary" type="submit">登录</button>
      </form>
    </section>
    <section class="dashboard" aria-label="连接与同步状态">
      <p id="sample" class="muted">正在读取状态…</p>
      <p id="notice" role="status"></p>
      <p id="operation" role="status"></p>
      <dl id="health" class="health"></dl>
      <section class="panel query-panel" aria-labelledby="sync-access-heading">
        <header class="node-heading">
          <h2 id="sync-access-heading">同步来访记录</h2>
          <select id="sync-access-minutes" aria-label="同步来访时间范围">
            <option value="15">最近 15 分钟</option>
            <option value="60" selected>最近 1 小时</option>
            <option value="360">最近 6 小时</option>
            <option value="1440">最近 24 小时</option>
          </select>
        </header>
        <p class="query-caption muted">来源为后端看到的直连 IP。同步受理后的投递结果见节点同步状态。</p>
        <p id="sync-access-status" class="query-caption muted" role="status">正在读取来访记录…</p>
        <div id="sync-access-results" class="query-overflow" tabindex="0" role="region" aria-label="同步来访明细" hidden>
          <table class="query-table">
            <thead><tr>
              <th scope="col">来源 IP</th><th scope="col">节点</th><th scope="col">请求</th>
              <th scope="col">令牌校验</th><th scope="col">处理结果</th><th scope="col">原因</th>
              <th scope="col">次数</th><th scope="col">最近来访</th>
            </tr></thead>
            <tbody id="sync-access-rows"></tbody>
          </table>
        </div>
      </section>
      <section class="panel query-panel" aria-labelledby="query-heading">
        <header class="node-heading">
          <h2 id="query-heading">Redis 查询缓存</h2>
          <select id="query-hours" aria-label="查询监控时间范围">
            <option value="1">最近 1 小时</option>
            <option value="6" selected>最近 6 小时</option>
            <option value="24">最近 24 小时</option>
          </select>
        </header>
        <p id="query-status" class="query-caption muted" role="status">正在读取查询指标…</p>
        <div id="query-results" hidden>
          <div id="query-chart" class="query-charts"></div>
          <div class="query-overflow" tabindex="0" role="region" aria-label="业务查询统计">
            <table id="query-table" class="query-table"></table>
          </div>
        </div>
      </section>
      <div id="nodes"></div>
      <noscript>启用 JavaScript 后可查看状态。</noscript>
    </section>
    <dialog id="editor" class="panel" aria-labelledby="editor-title">
      <form id="node-form">
        <h2 id="editor-title"></h2>
        <fieldset class="fields" id="fields">
          <label>节点 ID<input id="node-id" required maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_\\-]{0,63}"></label>
          <label>此节点的内部接收器 URL<input id="node-url" type="url" maxlength="512" placeholder="http://everunfold-frontend:3000"></label>
          <label class="check"><input id="node-private-http" type="checkbox"> 允许私有网络 HTTP 接收</label>
          <dl>
            <dt>前端 → 后端令牌</dt><dd id="node-inbound"></dd>
            <dt>后端 → 前端令牌</dt><dd id="node-outbound"></dd>
          </dl>
          <label>前端内部调用后端的来源 IP/CIDR<input id="node-peers" readonly></label>
          <label class="check"><input id="node-enabled" type="checkbox"> 启用</label>
        </fieldset>
        <p id="action-description" class="muted"></p>
        <p id="action-error" role="alert" class="bad"></p>
        <div class="actions">
          <button id="cancel" type="button">取消</button>
          <button id="submit" class="primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>
  </main>
  <script>
    for (const id of ["login-form", "logout-form"]) {
      const form = document.getElementById(id);
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = document.getElementById(id === "login-form" ? "message" : "operation");
        const button = form.querySelector("button");
        button.disabled = true;
        message.textContent = "";
        try {
          const response = await fetch(form.action, {
            method: "POST", body: new URLSearchParams(new FormData(form)), cache: "no-store",
          });
          if (response.ok && response.redirected) { location.replace(response.url); return; }
          const result = await response.json();
          message.textContent = result.msg || "操作未完成，请重试。";
        } catch {
          message.textContent = "连接失败，请重试。";
        } finally {
          button.disabled = false;
        }
      });
    }
    if (document.body.dataset.mode === "dashboard") {
      const byId = (id) => document.getElementById(id);
      const editor = byId("editor");
      let revision = null;
      let action = null;
      let returnFocus = null;
      let mutating = false;
      let accessRequest = null;
      const labels = new Map(Object.entries({
        online: "正常", unavailable: "无法读取", degraded: "异常", stale: "上报超时",
        never: "暂无上报", recent: "近期收到上报", disabled: "已停用", not_configured: "未配置接收器",
        unqueued: "尚未排队", pending: "等待同步", retrying: "等待重试", failed: "重试已用完",
        applied: "已确认", reachable: "连接正常", credential_missing: "缺少连接凭据",
        unreachable: "无法连接", rejected: "接收器拒绝访问", unsupported: "接收器未支持探测",
        invalid: "接收器响应无效", wrong_node: "节点 ID 不匹配", wrong_source: "数据来源不匹配",
        missing: "副本缺失",
      }));
      const resources = {
        "public-settings": "站点设置",
        "cache-policy": "缓存策略",
        "public-content": "公开内容",
      };
      const errorLabels = new Map(Object.entries({
        node_not_configured: "节点配置不完整",
        delivery_unavailable: "无法连接接收器",
        invalid_receipt: "接收回执不匹配",
        source_epoch_changed: "数据来源已变更",
        receiver_http_409: "接收器拒绝应用",
        delivery_failed: "投递失败",
      }));
      const show = (value) => labels.get(value) ?? "未知";
      const stamp = (value) => value ? new Date(value).toLocaleString() : "—";
      const el = (tag, text, className) => {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        if (className) node.className = className;
        return node;
      };
      const stateClass = (state) => ["online", "recent", "applied", "reachable"].includes(state)
        ? "good"
        : ["failed", "unreachable", "wrong_node", "wrong_source", "invalid", "rejected"].includes(state)
          ? "bad" : "muted";
      const accessOperations = new Map([
        ["internal_node_sync", "请求同步"], ["internal_node_recovery", "按需恢复"],
        ["internal_extensions", "上报扩展清单"],
      ]);
      const tokenChecks = new Map([
        ["missing", "未提供"], ["malformed", "格式错误"], ["unchecked", "已提供，未校验"],
        ["matched", "正确"], ["mismatch", "错误"],
      ]);
      async function refreshSyncAccess() {
        accessRequest?.abort();
        const current = new AbortController();
        accessRequest = current;
        const status = byId("sync-access-status");
        const table = byId("sync-access-results");
        try {
          const minutes = byId("sync-access-minutes").value;
          const response = await fetch("/_nodes/sync-access?minutes=" + encodeURIComponent(minutes), {
            cache: "no-store", signal: current.signal,
          });
          if (response.status === 401) { location.replace("/_nodes"); return; }
          if (!response.ok) throw new Error("access history unavailable");
          const { success, data } = await response.json();
          if (!success) throw new Error("access history unavailable");
          if (current.signal.aborted) return;
          const {request_count: total, accepted_count: accepted, source_count: sources, groups} = data;
          const summary = total ? `${total} 次来访 · ${sources} 个来源 · ${accepted} 次受理 · ${total - accepted} 次失败`
            : "此时间范围内暂无同步来访。";
          status.textContent = summary
            + (data.retention_limit_reached ? `。已达到 ${data.retention_limit} 条保留上限，可能还有更早记录` : "")
            + (data.group_count > groups.length ? `。明细显示最近 ${groups.length} 组` : "");
          table.hidden = !groups.length;
          byId("sync-access-rows").replaceChildren(...groups.map((group) => {
            const row = el("tr");
            const accepted = group.status >= 200 && group.status < 300;
            row.append(
              el("td", group.peer_ip === "unknown" ? "未知" : group.peer_ip),
              el("td", group.node_id),
              el("td", accessOperations.get(group.operation) ?? "未知"),
              el("td", tokenChecks.get(group.token_check) ?? "未知", group.token_check === "mismatch" ? "bad" : ""),
              el("td", (accepted ? "受理 " : "失败 ") + group.status, accepted ? "good" : "bad"),
              el("td", group.reason + (group.error_code ? " · " + group.error_code : "")),
              el("td", group.count), el("td", stamp(group.latest_at)),
            );
            return row;
          }));
        } catch {
          if (!current.signal.aborted) {
            table.hidden = true;
            status.textContent = "同步来访记录暂时无法读取，请检查运行 Redis 后刷新。";
          }
        } finally {
          if (accessRequest === current) accessRequest = null;
        }
      }
      const querySeries = [["hits", "命中"], ["misses", "未命中"], ["bypasses", "跳过"], ["errors", "错误"]];
      const queryBusinesses = {site: "站点信息", taxonomies: "分类与标签", content_list: "内容列表"};
      const queryStates = {ready: "已连接", unavailable: "连接异常", disabled: "已停用", unconfigured: "未配置"};
      const number = Intl.NumberFormat("zh-CN", {maximumFractionDigits: 2});
      const percent = Intl.NumberFormat("zh-CN", {style: "percent", maximumFractionDigits: 1});
      const svg = (tag, attributes) => {
        const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
        return node;
      };
      function queryPlot(title, trend, series, ceiling, axisNumber) {
        const chart = svg("svg", {viewBox: "0 0 480 156", class: "query-chart", role: "img", "aria-label": title});
        const coordinate = (index, value) => [45 + index * 424 / Math.max(1, trend.length - 1), 126 - value * 114 / ceiling];
        const legend = el("div", undefined, "query-legend");
        for (const [y, label] of [[12, ceiling], [126, 0]]) {
          chart.append(svg("line", {x1: 45, x2: 469, y1: y, y2: y, class: "grid"}));
          const text = svg("text", {x: 41, y: y + 4, "text-anchor": "end"});
          text.textContent = axisNumber.format(label);
          chart.append(text);
        }
        for (const [key, label, style = key] of series) {
          let points = [];
          const draw = () => {
            const line = "query-line " + style;
            if (points.length > 1) {
              chart.append(svg("polyline", {points: points.map((point) => point.join(",")).join(" "), class: line}));
            } else if (points.length === 1) {
              const [cx, cy] = points[0];
              chart.append(svg("circle", {cx, cy, r: 2, class: line}));
            }
            points = [];
          };
          trend.forEach((point, index) => {
            if (point[key] === null) draw();
            else points.push(coordinate(index, point[key]));
          });
          draw();
          const labelNode = el("span");
          const swatch = svg("svg", {viewBox: "0 0 22 10", "aria-hidden": "true"});
          swatch.append(svg("line", {x1: 0, x2: 22, y1: 5, y2: 5, class: "query-line " + style}));
          labelNode.append(swatch, document.createTextNode(label));
          legend.append(labelNode);
        }
        const clock = Intl.DateTimeFormat("zh-CN", {hour: "2-digit", minute: "2-digit"});
        for (const [point, x, anchor] of [[trend[0], 45, "start"], [trend.at(-1), 469, "end"]]) {
          const text = svg("text", {x, y: 149, "text-anchor": anchor});
          text.textContent = clock.format(new Date(point.at));
          chart.append(text);
        }
        const figure = el("figure");
        figure.append(el("figcaption", title), chart, legend);
        return figure;
      }
      function renderQueryChart(trend) {
        if (!trend.some((point) => point.queries > 0)) {
          byId("query-chart").replaceChildren(el("p", "所选时段暂无查询。", "query-caption muted"));
          return;
        }
        const ceiling = Math.max(1, ...trend.map((point) => Math.max(...querySeries.map(([key]) => point[key]))));
        const rate = trend.some((point) => point.hit_rate !== null)
          ? queryPlot("Redis 命中率", trend, [["hit_rate", "命中 ÷（命中 + 未命中）", "hits"]], 1, percent)
          : el("figure");
        if (!rate.childElementCount) {
          rate.append(el("figcaption", "Redis 命中率"), el("p", "所选时段无 Redis 命中或未命中记录。", "query-caption query-rate-empty muted"));
        }
        byId("query-chart").replaceChildren(
          queryPlot("查询趋势", trend, querySeries, ceiling, number),
          rate,
        );
      }
      let queryRequest = null;
      async function refreshQueryCache() {
        queryRequest?.abort();
        const request = new AbortController();
        queryRequest = request;
        try {
          const response = await fetch("/_nodes/query-cache?hours=" + encodeURIComponent(byId("query-hours").value), {cache: "no-store", signal: request.signal});
          if (response.status === 401) { location.replace("/_nodes"); return; }
          if (!response.ok) throw new Error("query metrics unavailable");
          const envelope = await response.json();
          if (!envelope.success) throw new Error("query metrics unavailable");
          const report = envelope.data;
          if (request.signal.aborted) return;
          const status = "查询缓存" + (queryStates[report.cache_status] ?? "状态未知");
          const available = report.metrics_status === "ready";
          byId("query-status").textContent = available ? status : status + "，统计暂不可用。";
          byId("query-results").hidden = !available;
          if (!available) return;
          renderQueryChart(report.trend);
          const head = el("thead");
          const labels = el("tr");
          for (const label of ["业务", "查询", "命中率", ...querySeries.map(([, label]) => label), "SQL 次数", "平均耗时", "P95 耗时"]) {
            const cell = el("th", label);
            cell.scope = "col";
            labels.append(cell);
          }
          head.append(labels);
          const body = el("tbody");
          for (const metrics of [report.total, ...report.businesses]) {
            const row = el("tr");
            const title = el("th", queryBusinesses[metrics.business] ?? "总查询审计");
            title.scope = "row";
            row.append(title);
            const latency = (value) => value === null ? "—" : number.format(value) + " ms";
            for (const value of [number.format(metrics.queries), metrics.hit_rate === null ? "—" : percent.format(metrics.hit_rate), ...querySeries.map(([key]) => number.format(metrics[key])), number.format(metrics.sql_queries), latency(metrics.mean_ms), latency(metrics.p95_ms)]) {
              row.append(el("td", value));
            }
            body.append(row);
          }
          byId("query-table").replaceChildren(head, body);
        } catch {
          if (request.signal.aborted) return;
          byId("query-status").textContent = "查询缓存监控暂不可用。";
          byId("query-results").hidden = true;
        } finally {
          if (queryRequest === request) queryRequest = null;
        }
      }
      function syncCard(name, history, replica) {
        const card = el("section", undefined, "resource");
        const grid = el("dl");
        const state = history?.state ?? "unavailable";
        const local = replica?.status === "ready" ? replica.revision : replica ? show(replica.status) : "—";
        const fields = [
          ["同步状态", show(state)],
          ["期望版本", history?.expected ?? "—"],
          ["最后确认", history?.acknowledged ?? "—"],
          ["接收器副本", local],
        ];
        for (const [label, value] of fields) {
          grid.append(el("dt", label), el("dd", value, label === "同步状态" ? stateClass(state) : ""));
        }
        card.append(el("h3", name), grid);
        if (history?.acknowledged_at) card.append(el("p", "确认时间 " + stamp(history.acknowledged_at), "detail"));
        if (history?.acknowledged && replica && replica.revision !== history.acknowledged) {
          card.append(el("p", "当前副本与最后确认记录不一致。", "detail warn"));
        }
        if (history?.error) {
          const error = errorLabels.get(history.error) ?? history.error.replace(/^receiver_http_/, "接收器 HTTP ");
          card.append(el("p", error + " · " + history.attempts + "/" + history.attempt_limit + " 次尝试", "detail"));
        }
        if (history?.next_retry_at) card.append(el("p", "下次重试 " + stamp(history.next_retry_at), "detail"));
        return card;
      }
      let pendingPairings = new Set();
      let pairings = {};
      let allowedPeerIps = [];
      function pairingCard(id) {
        const card = el("article", undefined, "panel node");
        const heading = el("div", undefined, "node-heading");
        const button = el("button", "配置并登记", "primary");
        button.type = "button";
        button.dataset.node = id;
        button.dataset.action = "pair";
        button.addEventListener("click", () => openEditor("add", { id }, button));
        heading.append(el("h2", id), button);
        card.append(heading, el("p", pairings[id]?.settings_receiver_url ?? "已保存配对，待登记。", "node-url muted"));
        return card;
      }
      function nodeCard(node) {
        const card = el("article", undefined, "panel node");
        const heading = el("div", undefined, "node-heading");
        const actions = el("div", undefined, "actions");
        const operationButton = (label, operation) => {
          const button = el("button", label);
          button.type = "button";
          button.dataset.node = node.id;
          button.dataset.action = operation;
          button.addEventListener("click", () => openEditor(operation, node, button));
          return button;
        };
        const paired = node.bound || pendingPairings.has(node.id);
        actions.append(el("span", node.enabled ? "已启用" : paired ? "已停用" : "待登记连接", "muted"));
        if (node.enabled && node.receiver_configured && revision !== null) {
          actions.append(operationButton("重新同步", "sync"));
        }
        if (revision > 0) {
          actions.append(operationButton("配置", "edit"), operationButton("删除", "delete"));
        }
        heading.append(el("h2", node.id), actions);
        const connection = el("div", undefined, "connection");
        const report = el("div");
        report.append(el("p", "前端上报 · " + show(node.inbound), stateClass(node.inbound)));
        report.append(el("p", stamp(node.last_report), "muted"));
        const receiver = el("div");
        receiver.append(el("p", "同步接收器 · " + show(node.receiver.state), stateClass(node.receiver.state)));
        receiver.append(el("p", stamp(node.receiver.checked_at), "muted"));
        connection.append(report, receiver);
        const cards = el("div", undefined, "resources");
        for (const [resource, label] of Object.entries(resources)) {
          cards.append(syncCard(label, node.sync[resource], node.receiver.replicas[resource]));
        }
        card.append(heading, el("p", pairings[node.id]?.settings_receiver_url ?? "未配置内部接收器", "node-url muted"), connection, cards);
        return card;
      }
      function openEditor(operation, node, trigger) {
        if (revision === null || mutating) return;
        action = { operation, revision, id: node?.id };
        returnFocus = trigger;
        const editable = operation === "add" || operation === "edit";
        const paired = Boolean(node && pendingPairings.has(node.id));
        const binding = pairings[node?.id];
        byId("editor-title").textContent = {
          add: paired ? "登记前端配对" : "新增节点", edit: "配置节点",
          delete: "删除节点", sync: "重新同步",
        }[operation];
        byId("fields").hidden = !editable;
        byId("fields").disabled = !editable;
        const id = byId("node-id");
        const url = byId("node-url");
        id.required = editable;
        url.required = editable && Boolean(binding);
        url.disabled = !binding;
        id.readOnly = !editable || operation === "edit" || paired;
        id.value = node?.id ?? "";
        url.value = binding?.settings_receiver_url ?? "";
        byId("node-private-http").checked = binding?.allow_private_http ?? false;
        byId("node-private-http").disabled = !binding;
        byId("node-inbound").textContent = binding?.inbound_configured ? "已配置（沿用 setup）" : "未配置";
        byId("node-outbound").textContent = binding?.outbound_configured ? "已配置（沿用 setup）" : "未配置";
        byId("node-peers").value = allowedPeerIps.join(", ");
        byId("node-enabled").checked = node?.enabled ?? false;
        byId("node-enabled").disabled = !binding;
        byId("action-description").textContent = {
          add: paired ? "令牌和来源规则沿用 setup。前端发布 URL 由前端自行上报。" : "先在 setup 保存该节点的配对；未配对时只能保存为停用。",
          edit: "令牌和来源规则在 setup 修改。更换内部接收器前请先停用节点。",
          delete: "删除 " + node?.id + " 后会停止向它投递，并拒绝后续上报。保留历史记录与前端副本。",
          sync: "向 " + node?.id + " 重发当前站点设置、缓存策略和公开内容。",
        }[operation];
        byId("action-error").textContent = "";
        byId("submit").textContent = operation === "delete" ? "删除" : operation === "sync" ? "重新同步" : "保存";
        editor.showModal();
        (editable ? id.readOnly ? url : id : byId("cancel")).focus();
      }
      byId("add").addEventListener("click", () => openEditor("add", null, byId("add")));
      byId("cancel").addEventListener("click", () => editor.close());
      editor.addEventListener("cancel", (event) => { if (mutating) event.preventDefault(); });
      editor.addEventListener("close", () => {
        if (returnFocus?.isConnected) returnFocus.focus();
        else byId("refresh").focus();
        action = null;
      });
      byId("node-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!action || mutating) return;
        const { operation, revision: expected, id } = action;
        const payload = { action: operation, expected_revision: expected, node_id: id ?? byId("node-id").value.trim() };
        if (operation === "add" || operation === "edit") payload.registration = {
          enabled: byId("node-enabled").checked,
        };
        if ((operation === "add" || operation === "edit") && !byId("node-url").disabled) payload.connection = {
          settings_receiver_url: byId("node-url").value.trim(),
          allow_private_http: byId("node-private-http").checked,
        };
        mutating = true;
        byId("submit").disabled = byId("cancel").disabled = true;
        byId("action-error").textContent = "";
        try {
          const response = await fetch("/_nodes/manage", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (response.status === 401) { location.replace("/_nodes"); return; }
          const envelope = await response.json();
          if (!response.ok || !envelope.success) { byId("action-error").textContent = envelope.msg; return; }
          const result = envelope.data;
          byId("operation").textContent = result.queued ? "已安排同步，等待接收器确认。" :
            operation === "delete" ? "节点已删除。" : "节点已保存。";
          editor.close();
        } catch {
          byId("action-error").textContent = "未能确认操作结果，请刷新节点状态。";
        } finally {
          mutating = false;
          byId("submit").disabled = byId("cancel").disabled = false;
          if (!editor.open) void refresh();
        }
      });
      async function refresh() {
        const button = byId("refresh");
        if (button.disabled || editor.open || mutating) return;
        if (!accessRequest) void refreshSyncAccess();
        if (!queryRequest) void refreshQueryCache();
        button.disabled = true;
        try {
          const response = await fetch("/_nodes/status", { cache: "no-store" });
          if (response.status === 401) { location.replace("/_nodes"); return; }
          if (!response.ok) throw new Error("status unavailable");
          const envelope = await response.json();
          if (!envelope.success) throw new Error("status unavailable");
          const value = envelope.data;
          if (editor.open) return;
          const focused = document.activeElement?.dataset;
          revision = value.registry_revision ?? null;
          pendingPairings = new Set(value.pending_pairings ?? []);
          pairings = value.pairings ?? {};
          allowedPeerIps = value.allowed_peer_ips ?? [];
          byId("add").hidden = !(revision > 0);
          byId("sample").textContent = "更新时间 " + stamp(value.sampled_at);
          byId("notice").textContent = revision === null ?
            "无法读取运行清单，以下为部署文件中的参考节点。" :
            value.history_available || !value.nodes.length ? "" : "同步记录暂时无法读取。";
          const health = [["API", value.api], ["数据库", value.database], ["Redis", value.redis],
            ["Worker", value.worker], ["Scheduler", value.scheduler]];
          byId("health").replaceChildren(...health.map(([label, status]) => {
            const item = el("div");
            item.append(el("dt", label), el("dd", show(status), stateClass(status)));
            return item;
          }));
          const registered = new Set(value.nodes.map((node) => node.id));
          const cards = [
            ...value.nodes.map(nodeCard),
            ...Array.from(pendingPairings).filter((id) => !registered.has(id)).map(pairingCard),
          ];
          byId("nodes").replaceChildren(...(cards.length ? cards : [el("p", "尚未配置前端节点。", "muted")]));
          if (focused?.node && focused?.action) {
            const buttons = Array.from(byId("nodes").querySelectorAll("button"));
            const target = buttons.find(
              (item) => item.dataset.node === focused.node && item.dataset.action === focused.action
            ) ?? buttons.find((item) => item.dataset.node === focused.node && item.dataset.action === "edit");
            (target ?? (byId("add").hidden ? byId("refresh") : byId("add"))).focus();
          }
          if (revision === 0 && !pendingPairings.size) {
            byId("notice").textContent = value.nodes.length
              ? "当前使用部署文件。导入节点清单后可在此增删和配置。"
              : "在 setup 保存前端配对并重启后端。";
          }
        } catch {
          byId("notice").textContent = "状态更新失败。页面保留上次读取的数据。";
        } finally {
          button.disabled = false;
        }
      }
      byId("refresh").addEventListener("click", refresh);
      byId("sync-access-minutes").addEventListener("change", refreshSyncAccess);
      byId("query-hours").addEventListener("change", refreshQueryCache);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) void refresh(); });
      setInterval(() => { if (!document.hidden) void refresh(); }, 15000);
      void refresh();
    }
  </script>
</body>
</html>
