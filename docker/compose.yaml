name: everunfold-backend

services:
  backend:
    image: ${BACKEND_IMAGE:-everunfold-backend:python312}
    build:
      context: ${BACKEND_SOURCE_DIR:-..}
      dockerfile: docker/Dockerfile
      args:
        BUILD_REVISION: ${EVERUNFOLD_BUILD_REVISION:-unknown}
        BUILD_CREATED: ${EVERUNFOLD_BUILD_CREATED:-unknown}
    init: true
    user: "${EVERUNFOLD_UID:-1000}:${EVERUNFOLD_GID:-1000}"
    restart: unless-stopped
    stop_grace_period: ${BACKEND_STOP_GRACE_PERIOD:-130s}
    container_name: ${BACKEND_CONTAINER_NAME:-everunfold-backend}
    network_mode: ${EVERUNFOLD_NETWORK:-bridge}
    environment:
      CONFIG_FILE: /config/${EVERUNFOLD_CONFIG_NAME:-config.yaml}
      EVERUNFOLD_DATA_DIR: /data
      API_PORT: "${BACKEND_API_PORT:-8001}"
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PUBLISH_PORT:-8001}:${BACKEND_API_PORT:-8001}"
    volumes:
      - type: bind
        source: ${EVERUNFOLD_CONFIG_DIR:-..}
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKEND_SOURCE_DIR:-..}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKEND_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
