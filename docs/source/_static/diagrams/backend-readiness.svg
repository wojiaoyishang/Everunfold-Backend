<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 707"
     width="760" height="707">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 9 5 L 0 10 Z" fill="#526a8c"/>
    </marker>
  </defs>
  <style>
    text {font-family: Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif}
    .step {fill: #fff; stroke: #b4c8e1; stroke-width: 1.4}
    .branch {fill: #fff8ed; stroke: #d6b289; stroke-width: 1.4}
    .badge {fill: #e1edff}
    .number {fill: #184485; font-size: 14px; font-weight: 700}
    .title {fill: #142747; font-size: 21px; font-weight: 700}
    .detail {fill: #344563; font-size: 17px}
    .transition {fill: #365b86; font-size: 15px}
    .arrow {fill: none; stroke: #526a8c; stroke-width: 1.6}
  </style>
  <rect x="0.5" y="0.5" width="759" height="706"
        rx="15" fill="#f4f7fc" stroke="#d6e1f0"/>
<rect x="20" y="20" width="412" height="111" rx="10" class="step"/><circle cx="53" cy="50" r="15" class="badge"/><text x="53" y="55" class="number" text-anchor="middle">1</text><text x="79" y="56" class="title" text-anchor="start">显式准备数据库</text><text x="79" y="84" class="detail" text-anchor="start">新实例运行初始化脚本</text><text x="79" y="108" class="detail" text-anchor="start">已有实例执行 Alembic 升级</text>
<path d="M 226 136 L 226 163" class="arrow" marker-end="url(#head)"/>

<rect x="20" y="171" width="412" height="87" rx="10" class="step"/><circle cx="53" cy="201" r="15" class="badge"/><text x="53" y="206" class="number" text-anchor="middle">2</text><text x="79" y="207" class="title" text-anchor="start">启动 API</text><text x="79" y="235" class="detail" text-anchor="start">加载配置，有效时创建运行实例</text>
<path d="M 436 214 L 478 214" class="arrow" marker-end="url(#head)"/>
<rect x="485" y="171" width="255" height="111" rx="10" class="branch"/><text x="503" y="207" class="title" text-anchor="start">存活检查</text><text x="503" y="235" class="detail" text-anchor="start">GET /health/live</text><text x="503" y="259" class="detail" text-anchor="start">API 能响应即返回 200</text>
<path d="M 226 263 L 226 290" class="arrow" marker-end="url(#head)"/>
<text x="240" y="280" class="transition" text-anchor="start">请求就绪探针</text>
<rect x="20" y="298" width="412" height="111" rx="10" class="step"/><circle cx="53" cy="328" r="15" class="badge"/><text x="53" y="333" class="number" text-anchor="middle">3</text><text x="79" y="334" class="title" text-anchor="start">开始就绪检查</text><text x="79" y="362" class="detail" text-anchor="start">GET /health/ready</text><text x="79" y="386" class="detail" text-anchor="start">检查运行实例是否可用</text>
<path d="M 436 353 L 478 353" class="arrow" marker-end="url(#head)"/>
<rect x="485" y="298" width="255" height="111" rx="10" class="branch"/><text x="503" y="334" class="title" text-anchor="start">503 · 配置不可用</text><text x="503" y="362" class="detail" text-anchor="start">configuration 检查失</text><text x="503" y="386" class="detail" text-anchor="start">败</text>
<path d="M 226 414 L 226 441" class="arrow" marker-end="url(#head)"/>
<text x="240" y="431" class="transition" text-anchor="start">配置可用</text>
<rect x="20" y="449" width="412" height="111" rx="10" class="step"/><circle cx="53" cy="479" r="15" class="badge"/><text x="53" y="484" class="number" text-anchor="middle">4</text><text x="79" y="485" class="title" text-anchor="start">并行检查依赖</text><text x="79" y="513" class="detail" text-anchor="start">连接 PostgreSQL 和 Redis</text><text x="79" y="537" class="detail" text-anchor="start">校验 Alembic 版本</text>
<path d="M 436 504 L 478 504" class="arrow" marker-end="url(#head)"/>
<rect x="485" y="461" width="255" height="87" rx="10" class="branch"/><text x="503" y="497" class="title" text-anchor="start">503 · 依赖不可用</text><text x="503" y="525" class="detail" text-anchor="start">在 checks 中查看失败项</text>
<path d="M 226 565 L 226 592" class="arrow" marker-end="url(#head)"/>
<text x="240" y="582" class="transition" text-anchor="start">全部通过</text>
<rect x="20" y="600" width="412" height="87" rx="10" class="step"/><circle cx="53" cy="630" r="15" class="badge"/><text x="53" y="635" class="number" text-anchor="middle">5</text><text x="79" y="636" class="title" text-anchor="start">200 · 就绪</text><text x="79" y="664" class="detail" text-anchor="start">数据库、Redis 和迁移均已就绪</text>
</svg>
