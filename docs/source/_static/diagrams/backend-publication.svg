<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 858"
     width="760" height="858">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 9 5 L 0 10 Z" fill="#526a8c"/>
    </marker>
  </defs>
  <style>
    text {font-family: Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif}
    .step {fill: #fff; stroke: #b4c8e1; stroke-width: 1.4}
    .branch {fill: #fff8ed; stroke: #d6b289; stroke-width: 1.4}
    .badge {fill: #e1edff}
    .number {fill: #184485; font-size: 14px; font-weight: 700}
    .title {fill: #142747; font-size: 21px; font-weight: 700}
    .detail {fill: #344563; font-size: 17px}
    .transition {fill: #365b86; font-size: 15px}
    .arrow {fill: none; stroke: #526a8c; stroke-width: 1.6}
  </style>
  <rect x="0.5" y="0.5" width="759" height="857"
        rx="15" fill="#f4f7fc" stroke="#d6e1f0"/>
<rect x="20" y="20" width="412" height="111" rx="10" class="step"/><circle cx="53" cy="50" r="15" class="badge"/><text x="53" y="55" class="number" text-anchor="middle">1</text><text x="79" y="56" class="title" text-anchor="start">触发公开内容变更</text><text x="79" y="84" class="detail" text-anchor="start">发布、定时发布、撤回</text><text x="79" y="108" class="detail" text-anchor="start">或回收已发布内容</text>
<path d="M 226 136 L 226 163" class="arrow" marker-end="url(#head)"/>

<rect x="20" y="171" width="412" height="111" rx="10" class="step"/><circle cx="53" cy="201" r="15" class="badge"/><text x="53" y="206" class="number" text-anchor="middle">2</text><text x="79" y="207" class="title" text-anchor="start">提交发布事务</text><text x="79" y="235" class="detail" text-anchor="start">原子保存公开快照、Outbox</text><text x="79" y="259" class="detail" text-anchor="start">和缓存事件</text>
<path d="M 436 226 L 478 226" class="arrow" marker-end="url(#head)"/>
<rect x="485" y="183" width="255" height="87" rx="10" class="branch"/><text x="503" y="219" class="title" text-anchor="start">事务失败</text><text x="503" y="247" class="detail" text-anchor="start">随业务修改一起回滚</text>
<path d="M 226 287 L 226 314" class="arrow" marker-end="url(#head)"/>
<text x="240" y="304" class="transition" text-anchor="start">等待调度</text>
<rect x="20" y="322" width="412" height="111" rx="10" class="step"/><circle cx="53" cy="352" r="15" class="badge"/><text x="53" y="357" class="number" text-anchor="middle">3</text><text x="79" y="358" class="title" text-anchor="start">Scheduler 派发</text><text x="79" y="386" class="detail" text-anchor="start">持 Redis 租约协调到期计划</text><text x="79" y="410" class="detail" text-anchor="start">经 Celery 派发 core.settings</text>
<path d="M 226 438 L 226 465" class="arrow" marker-end="url(#head)"/>
<text x="240" y="455" class="transition" text-anchor="start">执行编号</text>
<rect x="20" y="473" width="412" height="87" rx="10" class="step"/><circle cx="53" cy="503" r="15" class="badge"/><text x="53" y="508" class="number" text-anchor="middle">4</text><text x="79" y="509" class="title" text-anchor="start">Worker 认领投递</text><text x="79" y="537" class="detail" text-anchor="start">提交记录租约后向接收器发送</text>
<path d="M 226 565 L 226 592" class="arrow" marker-end="url(#head)"/>
<text x="240" y="582" class="transition" text-anchor="start">HTTP 请求</text>
<rect x="20" y="600" width="412" height="111" rx="10" class="step"/><circle cx="53" cy="630" r="15" class="badge"/><text x="53" y="635" class="number" text-anchor="middle">5</text><text x="79" y="636" class="title" text-anchor="start">接收器返回回执</text><text x="79" y="664" class="detail" text-anchor="start">Worker 核对来源、节点、资源、</text><text x="79" y="688" class="detail" text-anchor="start">版本和内容摘要</text>
<path d="M 436 655 L 478 655" class="arrow" marker-end="url(#head)"/>
<rect x="485" y="600" width="255" height="111" rx="10" class="branch"/><text x="503" y="636" class="title" text-anchor="start">发送或回执异常</text><text x="503" y="664" class="detail" text-anchor="start">按退避时间重试</text><text x="503" y="688" class="detail" text-anchor="start">达到上限后记录失败</text>
<path d="M 226 716 L 226 743" class="arrow" marker-end="url(#head)"/>
<text x="240" y="733" class="transition" text-anchor="start">回执匹配</text>
<rect x="20" y="751" width="412" height="87" rx="10" class="step"/><circle cx="53" cy="781" r="15" class="badge"/><text x="53" y="786" class="number" text-anchor="middle">6</text><text x="79" y="787" class="title" text-anchor="start">记录已应用</text><text x="79" y="815" class="detail" text-anchor="start">写入 applied_at</text>
</svg>
